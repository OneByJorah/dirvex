services:
  dirvex:
    image: dirvex:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-5000}:5000"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      STATUS_PATH: /data/status.json
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-900}
    volumes:
      - type: bind
        source: ${STATUS_DIRECTORY:-./demo}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16777216,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
