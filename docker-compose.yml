# =============================================================================
# dirvex — docker-compose.yml
# =============================================================================

services:
  dirvex:
    image: ghcr.io/onebyjorah/dirvex:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dirvex
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-5000}:5000"
    volumes:
      # Mock DC status data (can be replaced with real data)
      - ./mock_dc_status.json:/app/mock_dc_status.json:ro
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - dirvex_net

volumes:
  dirvex_data:
    driver: local

networks:
  dirvex_net:
    driver: bridge
