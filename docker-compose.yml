# =============================================================================
# dirvex — docker-compose.yml
# =============================================================================

services:
  dirvex:
    image: ghcr.io/onebyjorah/dirvex:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dirvex
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      # Mock DC status data (can be replaced with real data)
      - ./mock_dc_status.json:/app/mock_dc_status.json:ro
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
    networks:
      - dirvex_net

volumes:
  dirvex_data:
    driver: local

networks:
  dirvex_net:
    driver: bridge
